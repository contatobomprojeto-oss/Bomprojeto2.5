
<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <radialGradient id="glow" cx="85%" cy="15%" r="60%">
      <stop offset="0%" stop-color="#ea580c" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#ea580c" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#ea580c" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)" />
  <rect width="1200" height="630" fill="url(#glow)" />

  <!-- Subtle Grid Lines -->
  <g stroke="#334155" stroke-opacity="0.25" stroke-width="1">
    <line x1="0" y1="105" x2="1200" y2="105" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="315" x2="1200" y2="315" />
    <line x1="0" y1="420" x2="1200" y2="420" />
    <line x1="0" y1="525" x2="1200" y2="525" />
    <line x1="200" y1="0" x2="200" y2="630" />
    <line x1="400" y1="0" x2="400" y2="630" />
    <line x1="600" y1="0" x2="600" y2="630" />
    <line x1="800" y1="0" x2="800" y2="630" />
    <line x1="1000" y1="0" x2="1000" y2="630" />
  </g>

  <!-- Brand Header: Logo BOMProjeto -->
  <g transform="translate(80, 60)">
    <!-- 9-dot icon -->
    <g transform="scale(0.24)">
      <circle cx="134" cy="92" r="18" fill="#ffffff" />
      <circle cx="200" cy="92" r="17" fill="#ffffff" />
      <circle cx="266" cy="92" r="17" fill="#ffffff" />
      <circle cx="113" cy="176" r="30" fill="#f97316" />
      <circle cx="200" cy="176" r="30" fill="#f97316" />
      <circle cx="287" cy="176" r="30" fill="#f97316" />
      <circle cx="80" cy="285" r="42" fill="#ffffff" />
      <circle cx="200" cy="285" r="42" fill="#ffffff" />
      <circle cx="320" cy="285" r="42" fill="#ffffff" />
    </g>
    <!-- Logo Typography -->
    <text x="100" y="52" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="44" letter-spacing="-1px">
      <tspan fill="#ffffff">BOM</tspan><tspan fill="#f97316">Projeto</tspan>
    </text>
    <!-- Tagline -->
    <text x="365" y="47" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="16" fill="#94a3b8" letter-spacing="1.5px">
      | GESTÃO &amp; ACOMPANHAMENTO DE PROJETOS
    </text>
  </g>

  <!-- Right Pill: Status Online -->
  <g transform="translate(900, 65)">
    <rect width="220" height="42" rx="21" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <circle cx="26" cy="21" r="5" fill="#22c55e" />
    <text x="42" y="26" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#f1f5f9" letter-spacing="0.5px">
      PORTAL OFICIAL 24H
    </text>
  </g>

  <!-- Main Content Card -->
  <g transform="translate(80, 150)">
    <rect width="1040" height="390" rx="24" fill="url(#cardBg)" stroke="#334155" stroke-width="1.5" />

    <!-- Top Badge inside card: Empresa Assinante -->
    <g transform="translate(48, 42)">
      <rect width="260" height="32" rx="16" fill="#f97316" fill-opacity="0.15" stroke="#f97316" stroke-opacity="0.4" stroke-width="1" />
      <text x="20" y="21" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" fill="#fb923c" letter-spacing="1px">
        ★ EMPRESA ASSINANTE OFICIAL
      </text>
    </g>

    <!-- Company Name / Title -->
    <text x="48" y="130" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="46" fill="#ffffff" letter-spacing="-1px">
      Acompanhe seu Projeto em Tempo Real
    </text>

    <!-- Subtitle / Context -->
    <text x="48" y="175" font-family="system-ui, -apple-system, sans-serif" font-weight="500" font-size="22" fill="#cbd5e1">
      Transparência em cada etapa: medição, corte, usinagem e montagem com fotos reais.
    </text>

    <!-- Inner feature box -->
    <g transform="translate(48, 215)">
      <rect width="944" height="95" rx="16" fill="#090d16" fill-opacity="0.7" stroke="#1e293b" stroke-width="1" />
      
      <!-- Feature 1 -->
      <g transform="translate(32, 32)">
        <circle cx="16" cy="16" r="16" fill="#f97316" fill-opacity="0.2" />
        <path d="M11 16 L15 20 L22 12" stroke="#f97316" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" />
        <text x="44" y="16" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#ffffff">Fotos da Bancada</text>
        <text x="44" y="32" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#94a3b8">Registros técnicos reais</text>
      </g>

      <!-- Feature 2 -->
      <g transform="translate(340, 32)">
        <circle cx="16" cy="16" r="16" fill="#22c55e" fill-opacity="0.2" />
        <path d="M11 16 L15 20 L22 12" stroke="#22c55e" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" />
        <text x="44" y="16" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#ffffff">Acesso Sem Senha</text>
        <text x="44" y="32" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#94a3b8">Link direto e seguro</text>
      </g>

      <!-- Feature 3 -->
      <g transform="translate(640, 32)">
        <circle cx="16" cy="16" r="16" fill="#38bdf8" fill-opacity="0.2" />
        <path d="M11 16 L15 20 L22 12" stroke="#38bdf8" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" />
        <text x="44" y="16" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#ffffff">Cronograma e Etapas</text>
        <text x="44" y="32" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#94a3b8">Avanço percentual verificado</text>
      </g>
    </g>

    <!-- Bottom Footer inside card -->
    <text x="48" y="352" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#64748b" letter-spacing="0.5px">
      DISPARADO AUTOMATICAMENTE VIA BOMPROJETO • SISTEMA OFICIAL DE GESTÃO PARA MARCENARIAS E ARQUITETURA
    </text>
  </g>

  <!-- Bottom Brand Signature -->
  <text x="600" y="590" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500" fill="#64748b">
    bomprojeto.com • Link de Acompanhamento Seguro do Cliente
  </text>
</svg>
