<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <!-- Fundo sutil transparente com contraste garantido -->
  <rect width="400" height="400" fill="transparent" rx="80" />
  
  <!-- Linha Superior - 3 pontos pretos -->
  <circle cx="134" cy="92" r="18" fill="#111111" />
  <circle cx="200" cy="92" r="18" fill="#111111" />
  <circle cx="266" cy="92" r="18" fill="#111111" />

  <!-- Linha Intermediária - 3 pontos laranja oficial BOMProjeto -->
  <circle cx="113" cy="176" r="30" fill="#FF6515" />
  <circle cx="200" cy="176" r="30" fill="#FF6515" />
  <circle cx="287" cy="176" r="30" fill="#FF6515" />

  <!-- Linha Inferior - 3 pontos grandes pretos -->
  <circle cx="80" cy="285" r="42" fill="#111111" />
  <circle cx="200" cy="285" r="42" fill="#111111" />
  <circle cx="320" cy="285" r="42" fill="#111111" />
</svg>
