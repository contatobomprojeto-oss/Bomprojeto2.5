    <!-- Safe Window fetch compatibility shim (executes first to prevent: Cannot set property fetch of #<Window> which has only a getter) -->
    <script>
      (function() {
        try {
          if (typeof window !== 'undefined') {
            var _curFetch = window.fetch;
            var _active = _curFetch;
            // Define an accessor with both get and set directly on window
            // This guarantees window.fetch can be read and reassigned by any script or Chrome extension
            try {
              Object.defineProperty(window, 'fetch', {
                get: function() {
                  return _active;
                },
                set: function(v) {
                  _active = v;
                },
                configurable: true,
                enumerable: true
              });
            } catch (e1) {
              try {
                window.fetch = _curFetch;
              } catch (e2) {}
            }

            // Also patch Window.prototype if accessible
            try {
              if (typeof Window !== 'undefined' && Window.prototype) {
                var pDesc = Object.getOwnPropertyDescriptor(Window.prototype, 'fetch');
                if (pDesc && (!pDesc.set || !pDesc.writable)) {
                  Object.defineProperty(Window.prototype, 'fetch', {
                    get: function() {
                      return window.fetch || _curFetch;
                    },
                    set: function(val) {
                      window.fetch = val;
                    },
                    configurable: true,
                    enumerable: true
                  });
                }
              }
            } catch (eProto) {}
          }
        } catch (err) {}
      })();
    </script>
